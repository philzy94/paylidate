services:
  app:
    build: .
    ports:
      - "8000:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_DATABASE: paylidate
      DB_USERNAME: paylidate
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: paylidate
      MYSQL_USER: paylidate
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
