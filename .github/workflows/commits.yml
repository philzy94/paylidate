name: Commit messages

on:
  pull_request:

jobs:
  subjects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          status=0
          while IFS= read -r subject; do
            if [ "${#subject}" -gt 72 ] || [ "${#subject}" -lt 12 ]; then
              echo "Subject should be 12-72 characters: $subject"; status=1
            fi
            if echo "$subject" | grep -qiE '^(wip|fix|update|changes?|stuff|tmp)\.?$'; then
              echo "Subject says nothing about the change: $subject"; status=1
            fi
          done < <(git log --no-merges --format=%s "$base..HEAD")
          exit $status
